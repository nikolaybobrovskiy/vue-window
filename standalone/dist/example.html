<!DOCTYPE html>
<html lang="en">

<head>
    <title>VueWindow standalone</title>
    <script src="https://cdn.jsdelivr.net/npm/vue@3.5.43/dist/vue.global.js"></script>
    <script src="./vue-window-standalone.js"></script>
    <script>
        window.addEventListener('load', e => {
            var app = Vue.createApp({
                data() { return { title: '' } }
            })
            var vm = app.use(VueWindow).mount('#root')
            var refreshTitle = function () {
                vm.title = String(new Date())
            }
            setInterval(refreshTitle, 1000)
        })
    </script>
    <style>
        body {
            margin: 0;
            background-color: #777;
        }
    </style>
</head>

<body>
    <div id="root">
        <hsc-window-style-metal>
            <hsc-window title="Window 1">
                Parameters:
                <fieldset>
                    <legend>&alpha;</legend>
                    <input type="range" />
                </fieldset>
                <fieldset>
                    <legend>&beta;</legend>
                    <input type="range" />
                </fieldset>
            </hsc-window>

            <hsc-window :title="title">
                Parameters:
                <fieldset>
                    <legend>&gamma;</legend>
                    <input type="range" />
                </fieldset>
                <fieldset>
                    <legend>&delta;</legend>
                    <input type="range" />
                </fieldset>
            </hsc-window>
        </hsc-window-style-metal>
    </div>
</body>

</html>
